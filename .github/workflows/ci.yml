name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the older run. On main, every push gets a group of
# its own, so a run that is releasing is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs, so a moved or compromised tag can't change what runs.
jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  listing:
    name: Registry listing and licences
    runs-on: ubuntu-24.04
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Production dependencies are permissively licensed
        run: |
          npm ci --omit=dev --ignore-scripts
          node scripts/check-licenses.mjs
      - name: server.json passes the MCP Registry's validation
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag whoop-mcp-server .
      - name: Carries the label the MCP Registry checks
        run: |
          label=$(docker inspect --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' whoop-mcp-server)
          test "$label" = "$(jq -r .name server.json)"
      - name: Refuses to start without MCP_AUTH_PASSWORD
        run: |
          if docker run --rm whoop-mcp-server; then
            echo "The server started without MCP_AUTH_PASSWORD" >&2
            exit 1
          fi
      - name: Starts, and keeps /mcp behind sign-in
        run: |
          docker run --detach --name server --publish 3000:3000 \
            --env MCP_AUTH_PASSWORD=ci-smoke-test-password \
            --env WHOOP_CLIENT_SECRET=ci-smoke-test-secret \
            whoop-mcp-server
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:3000/health && break
            sleep 1
          done
          curl --silent --fail http://localhost:3000/health
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://localhost:3000/mcp --header 'Content-Type: application/json' --data '{}')
          test "$status" = 401
      - name: Server logs
        if: failure()
        run: docker logs server

  # Merging is releasing: once every check above has passed on a push to main, release.yml
  # tags, publishes and lists the version in package.json if it's new. Pull requests skip it.
  release:
    name: Release
    needs: [test, audit, listing, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'yuridivonis/whoop-mcp-server'
    uses: ./.github/workflows/release.yml
    # The most any release job may use; each job in release.yml asks for less.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: release
      cancel-in-progress: false
